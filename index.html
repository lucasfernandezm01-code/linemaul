<title>Line &amp; Maul</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line &amp; Maul">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:image" content="https://lucasfernandezm01-code.github.io/linemaul/logo-512.png">

<style>
/* Layout: app de una columna, cancha vertical como protagonista. Identidad Line & Maul: bordó profundo de fondo, dorado para lo importante y azul real en los bordes del emblema. Cada club con su camiseta. Tema único oscuro. */
:root{
  --bg:#1c0b08; --surface:#2b130f; --fg:#f6efe6; --muted:#c7ad9f; --line:#4f2b22; --chip:#3b1b15; --blue:#2349a8;
  --pitch:#1a5a3a; --pitch2:#1d6340; --chalk:rgba(255,255,255,.5);
  --accent:#f2c21a; --accent-fg:#2a1500; --good:#56c98b; --bad:#ff7a6b;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 50% -12%,var(--glow),transparent 60%),radial-gradient(ellipse at 50% -20%,rgba(242,194,26,.10),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 16px);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;font-weight:800;line-height:1;text-transform:uppercase}
h2{font-size:22px;font-weight:700;text-transform:uppercase}
h3{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h2,h3{font-style:italic}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;gap:14px}
header.top #gLogo{cursor:pointer}
.topbar{display:flex;align-items:center;gap:8px;min-height:0;margin-bottom:10px}.topbar:empty{display:none}
#homeBtn{padding:6px 12px 6px 9px;display:inline-flex;align-items:center;gap:6px}
.games{display:none!important}
body.is-home header.top>.emb,body.is-home header.top>.brand,body.is-home #homeBtn,body.is-home .games,body.is-home #tabs,body.is-home main,body.is-home #savebar{display:none!important}
body.is-home header.top{display:none}
body.is-home{background-image:radial-gradient(ellipse at 0% 0%,rgba(124,26,14,.55),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(35,73,168,.45),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 16px)}
#home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:6px 0 32px}
#home .hlogo{width:min(74vw,320px);height:auto;aspect-ratio:1;filter:drop-shadow(0 14px 34px rgba(0,0,0,.6))}
#home .hslogan{font:italic 700 18px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:-2px 0 6px}
#home .inst{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:14px;padding:10px 12px;border-radius:12px;border:1px solid rgba(246,239,230,.14);background:rgba(0,0,0,.18);font-size:13px;line-height:1.35;color:rgba(246,239,230,.8)}#home .inst span{flex:1}#home .instx{appearance:none;background:none;border:0;color:inherit;font-size:22px;line-height:1;cursor:pointer;opacity:.6;padding:0 4px}
#home .hpick{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:rgba(246,239,230,.6);margin-top:4px}
#home .hgames{display:flex;flex-direction:column;gap:12px;width:100%}
.hgame{appearance:none;display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 14px 14px 12px;border-radius:16px;border:1px solid;cursor:pointer;color:#f6efe6;font-family:var(--body);box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .15s}
.hgame:active{transform:scale(.98)}
.hgame.dt{background:linear-gradient(135deg,#6a1a0f,#2b130f 75%);border-color:#8a2a1a}
.hgame.prode{background:linear-gradient(135deg,#1f3a86,#0b1430 75%);border-color:#2f4690}
.hgame img{width:74px;height:74px;flex:none;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.hgame .hb{flex:1;min-width:0}
.hgame .eyebrow{display:block;font:italic 700 11px var(--display);letter-spacing:.3em;text-transform:uppercase;color:#f2c21a;margin-bottom:2px}
.hgame .ht{display:block;font:italic 800 clamp(22px,6.6vw,30px)/1 var(--display);white-space:nowrap;text-transform:uppercase}.hgame .ht span{color:#f2c21a}
.hgame small{display:block;font-size:13px;line-height:1.35;color:rgba(246,239,230,.75);margin-top:5px}
.hgame .hgo{flex:none;color:#f2c21a;font-size:26px;line-height:1}
header.top .emb{display:block;width:58px;height:58px;object-fit:contain;flex:none;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.brand{min-width:0}
.brand .eyebrow{display:block;font:italic 700 12px var(--display);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.brand h1 span{color:var(--accent)}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 15px var(--body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 14px var(--body);white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);align-self:flex-start}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.abierta{background:var(--good)}.dot.proxima{background:transparent;border:1.5px solid var(--muted)}.dot.cerrada{background:var(--accent)}.dot.final{background:var(--muted)}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--chip);font-size:14px;display:flex;gap:10px;align-items:center}
.banner b{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{font:500 16px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:140px;resize:vertical;font-size:14px;line-height:1.5}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--body);padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
/* Cancha */
.pitch{border-radius:14px;padding:18px 8px 94px;background:repeating-linear-gradient(180deg,var(--pitch) 0 44px,var(--pitch2) 44px 88px);position:relative;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:8px;border:2px solid var(--chalk);border-radius:6px;pointer-events:none}
/* líneas reales: mitad de cancha arriba, ingoal propio abajo */
.pitch .lines{position:absolute;inset:8px;pointer-events:none}
.pitch .ln{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--chalk)}
.pitch .ln.dash{border-top-style:dashed;opacity:.8}
.pitch .ln.half{top:0;border-top-width:3px}
.pitch .ln.d10{top:17%}
.pitch .ln.l22{top:50%}
.pitch .ln.d5{bottom:78px}
.pitch .ln.try{bottom:44px;border-top-width:3px;border-color:rgba(255,255,255,.75)}
.pitch .ingoal{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(0,0,0,.14);border-radius:0 0 6px 6px}
.pitch .vt{position:absolute;top:0;bottom:44px;width:0;border-left:2px dashed var(--chalk);opacity:.35}
.pitch .vt.a{left:7%}.pitch .vt.b{left:21%}.pitch .vt.c{right:21%}.pitch .vt.d{right:7%}
.pitch .lbl{position:absolute;left:5px;font:italic 800 13px var(--display);color:var(--chalk);transform:translateY(-120%);letter-spacing:.04em}
.pitch .lbl.r{left:auto;right:5px}
.pitch .posts{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:46px;height:40px;overflow:visible}
.bench{border-radius:14px;padding:10px 8px 12px;background:linear-gradient(180deg,#26352b,#1b261f);display:flex;flex-direction:column;gap:8px}
.bench .bhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 6px}.bench .bhd h3{margin:0;color:#fff}.bench .bhd .muted{color:rgba(255,255,255,.65)}
.bench .brow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;justify-items:center}.bench .slot{width:100%;max-width:88px}
.banner.cambios{align-items:center;gap:12px}.banner.cambios b{font-family:var(--body);text-transform:none;letter-spacing:0}
.cdots{display:flex;gap:4px;flex:none}.cdots i{width:12px;height:12px;border-radius:50%;background:var(--accent)}.cdots i.u{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.banner.cambios.sin .cdots i.u{box-shadow:inset 0 0 0 2px var(--accent);opacity:.6}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mcard{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--chip);border:1px solid var(--line)}.mcard b{font:800 30px/1 var(--display);color:var(--accent)}.mcard span{font-weight:600;font-size:14px}.mcard small{font-size:12px;color:var(--muted)}
.mbars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}.mbar i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:var(--accent)}.mbar span{font-size:11px}.mbar small{font-size:10px;color:var(--muted)}
.mclubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}.mclubs div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
.mplist{display:flex;flex-direction:column}.mprow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}.mprow>.num{width:18px;text-align:right;flex:none}
.mpn{display:flex;flex-direction:column;flex:1;min-width:0}.mpn small{color:var(--muted);font-size:12px}.mpv{display:flex;flex-direction:column;align-items:flex-end;flex:none}.mpv b{font-size:16px}.mpv small{color:var(--muted);font-size:11px}
.mpsub{margin-top:12px}.mpsub h4{margin:0 0 2px;font:italic 700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mlist{display:flex;flex-direction:column;margin-top:8px}.murow{border-bottom:1px solid var(--line)}.murow summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;cursor:pointer;list-style:none}.murow summary::-webkit-details-marker{display:none}
.murow .mu{display:flex;flex-direction:column;min-width:0}.murow .mu small{color:var(--muted);font-size:12px}.mtags{display:flex;gap:4px;flex:none}.mtags .tag{opacity:.45}.mtags .tag.on{opacity:1;background:var(--accent);color:var(--accent-fg)}.mdet{padding:4px 2px 12px}
.swaps{border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:6px}
.prow{display:flex;justify-content:center;align-items:flex-start;gap:clamp(12px,5vw,28px);position:relative}.prow.four{gap:clamp(4px,2.6vw,20px)}.prow.mid{gap:clamp(28px,12vw,64px)}
.slot{appearance:none;border:0;background:rgba(0,0,0,.18);color:#fff;border-radius:10px;padding:6px 4px 7px;width:88px;min-width:0;flex:0 1 88px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;font-family:var(--body)}
.slot:hover{background:rgba(0,0,0,.28)}
.slot .jsy{width:78px;height:73px;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.slot.empty .jsy{filter:none}
.jt{font-family:var(--display);font-weight:800;fill:#fff;stroke:#0d1f45;stroke-width:1.6px;paint-order:stroke;letter-spacing:.02em}
.jn{font-family:var(--display);font-weight:800;font-size:22px}
.slot .shirt{width:30px;height:30px;border-radius:50%;background:#fff;color:#14201a;font:800 16px/30px var(--display);text-align:center}
.slot.empty{padding:6px 4px 7px;border:1px dashed rgba(255,255,255,.28);border-radius:10px;color:#fff}
.slot.empty .nm{opacity:.85}.slot.empty .dv{opacity:.65}
.slot.empty .shirt{background:transparent;color:#fff;border:2px dashed rgba(255,255,255,.7);line-height:26px}
.slot .nm{font-weight:600;font-size:13px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .dv{font-size:11px;opacity:.8;white-space:nowrap}
.slot .badges{position:absolute;top:2px;right:4px;display:flex;gap:2px;z-index:2}
.rb{display:inline-block;min-width:18px;height:18px;padding:0 3px;border-radius:9px;font:800 11px/18px var(--display);text-align:center;background:#fff;color:#14201a}
.rb.cap{background:var(--accent);color:var(--accent-fg)}
.rb.kick{background:#7cc4ff;color:#06263d}
.rb.hc{background:#c9a8ff;color:#22104a}
.rb.big{min-width:34px;height:34px;border-radius:17px;font-size:15px;line-height:34px;flex:none}
.roles{display:flex;flex-direction:column;gap:8px}
.role{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-family:var(--body)}
.role:hover:not(:disabled){border-color:var(--accent)}
.role:disabled{cursor:default}
.role .rt{display:flex;flex-direction:column;min-width:0;flex:1}
.role .rt b{font-size:15px}
.role .rv{font-weight:700;font-size:15px;white-space:nowrap;color:var(--accent)}
.role.set .rv{color:var(--fg)}
.rv .hcv{display:flex;flex-direction:column;align-items:flex-end;white-space:normal;text-align:right;line-height:1.2}
.slot .pt{position:absolute;top:2px;left:6px;font:700 12px var(--display);background:rgba(0,0,0,.45);border-radius:4px;padding:0 4px}
.divcount{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc b{flex:none}
.dc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:6px}
.dc b{font-family:var(--display);font-size:16px}
.dc.full{border-color:var(--accent)}
.dc.full b{color:var(--accent)}
.slot .rb,.slot .tt{cursor:help}
.tt-in{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:3px;background:#2f9e55;color:#fff;font:800 11px var(--display);vertical-align:-2px}
.slot .mplate{display:flex;flex-direction:column;width:100%;max-width:86px;margin-top:1px;border-radius:5px;overflow:hidden;background:rgba(8,14,10,.82);box-shadow:0 1px 3px rgba(0,0,0,.35);font-size:11px;line-height:1.3}
.mplate .mclub{padding:2px 5px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mplate .mrow{display:flex;border-top:1px solid rgba(255,255,255,.1)}
.mplate .tt{flex:none;width:16px;display:grid;place-items:center;font:800 12px var(--display);background:#2f9e55;color:#fff}
.mplate .mvs{flex:1;min-width:0;padding:2px 3px;font-size:10.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.othc{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;border-top:1px dashed var(--line)}
.chip.ghost{background:transparent;border-style:dashed;opacity:.85}
.chip.ghost[aria-pressed="true"]{opacity:1;background:transparent;color:var(--accent);border-color:var(--accent)}
.altag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--al);background:color-mix(in srgb,var(--al) 14%,transparent);border-radius:5px;padding:2px 7px;white-space:nowrap}
.altag.sm{font-size:10.5px;padding:1px 6px;gap:4px;margin-top:2px;background:rgba(10,30,20,.55);border:1px solid color-mix(in srgb,var(--al) 45%,transparent)}
.altag.sm i{width:6px;height:6px}
.altag i{width:7px;height:7px;border-radius:50%;background:var(--al);display:inline-block}
.slot .aldot{position:absolute;left:6px;bottom:24px;width:11px;height:11px;border-radius:50%;background:var(--al);box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.allegend{display:flex;flex-wrap:wrap;gap:6px}
.dc.over{border-color:var(--bad)}.dc.over b{color:var(--bad)}
.cardimg{width:100%;max-width:420px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.btn.share{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-color:var(--accent);color:var(--accent);background:rgba(242,194,26,.06);font-family:var(--display);font-size:18px;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.06em}
.btn.share:hover:not(:disabled){background:rgba(242,194,26,.14)}
.ligas{display:flex;flex-direction:column;gap:10px}
.chip.addliga{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
.ligahd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:rgba(242,194,26,.06)}
.ligahd .eyebrow{display:block;font:italic 700 11px var(--display);letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.code{font:800 22px var(--display);letter-spacing:.22em;color:var(--accent);background:rgba(0,0,0,.25);border-radius:8px;padding:4px 10px;user-select:all;-webkit-user-select:all}
.tag.late{background:rgba(255,122,107,.15);color:var(--bad)}
.mv{display:block;font:700 11px var(--body);line-height:1.1;margin-top:2px;letter-spacing:0}
.mv.up{color:var(--good)}.mv.down{color:var(--bad)}.mv.eq{color:var(--muted)}.mv.new{color:var(--accent);font-size:9px;letter-spacing:.05em}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px}
.pod{display:flex;flex-direction:column;align-items:stretch;cursor:pointer;min-width:0}

const KITS_DEF={"Hindú":{c1:"#2f72c8",c2:"#f3b733",pat:"aros"},"Newman":{c1:"#5c1a2a",c2:"#e8a32a",pat:"lisa"}};
function kitOf(club){const k=(S.kits&&S.kits[club])||KITS_DEF[club]||KIT_DEF;return {c1:/^#[0-9a-f]{6}$/i.test(k.c1||"")?k.c1:KIT_DEF.c1,c2:/^#[0-9a-f]{6}$/i.test(k.c2||"")?k.c2:KIT_DEF.c2,c3:/^#[0-9a-f]{6}$/i.test(k.c3||"")?k.c3:KIT_DEF.c3,pat:PATS[k.pat]?k.pat:"lisa",cc:/^#[0-9a-f]{6}$/i.test(k.cc||"")?k.cc:(k.pat==="lisa"&&/^#[0-9a-f]{6}$/i.test(k.c2||"")?k.c2:"#ffffff")}}
function kitBands(k){const o=[];const c=k.c2;if(k.pat==="aros")for(let y=0;y<60;y+=7.5)o.push([0,y,64,3.75,c]);else if(k.pat==="finos")for(let y=3;y<60;y+=6)o.push([0,y,64,1.7,c]);else if(k.pat==="anchos")for(let y=0;y<60;y+=16)o.push([0,y,64,8,c]);else if(k.pat==="tricolor")for(let y=4;y<60;y+=13){o.push([0,y,64,2.6,c]);o.push([0,y+2.6,64,4,k.c3])}else if(k.pat==="bastones")for(let x=2;x<64;x+=8)o.push([x,0,4,60,c]);else if(k.pat==="mitades")o.push([32,0,32,60,c]);else if(k.pat==="banda")o.push([0,26,64,9,c]);else if(k.pat==="ribete")for(let y=6;y<60;y+=14){o.push([0,y,64,1.6,c]);o.push([0,y+1.6,64,4,k.c3]);o.push([0,y+5.6,64,1.6,c])}else if(k.pat==="alternas"){let i=0;for(let y=3;y<60;y+=6.5)o.push([0,y,64,2.2,(i++%2)?k.c3:c])}else if(k.pat==="pecho"){o.push([0,0,64,22,c]);for(let y=23;y<31;y+=2.6)o.push([0,y,64,1.1,c])}else if(k.pat==="cuartos"){o.push([32,0,32,30,c]);o.push([0,30,32,30,c])}else if(k.pat==="diagonal")o.push(["P",[[0,0],[24,0],[45,60],[0,60]],c]);return o}
const HC_PTS={G:3,E:0,P:-3};const RES_N={G:"Ganó",E:"Empató",P:"Perdió"};
/* un jugador puede tener varios puestos: g = principal, gs = lista acumulada */
/* ala y octavo se unificaron en "Tercera línea" (los datos viejos se convierten al cargar) */
const G_OLD={ALA:"TER",OCT:"TER"};
function normPlantel(pl){const o={};for(const [id,p] of Object.entries(pl||{})){if(!p)continue;const q=Object.assign({},p);q.g=G_OLD[q.g]||q.g;if(Array.isArray(q.gs))q.gs=[...new Set(q.gs.map(x=>G_OLD[x]||x))];o[id]=q}return o}
function posList(p){const l=Array.isArray(p.gs)&&p.gs.length?p.gs.filter(x=>GROUPS[x]):[];if(!l.includes(p.g))l.unshift(p.g);return l}
function posNames(p){return posList(p).map(x=>GROUPS[x].n).join(" / ")}
const ESTADOS={abierta:"Abierta",cerrada:"Cerrada",final:"Puntos publicados",proxima:"Próxima"};
const ESTADOS_ADMIN={auto:"Automática (según horario)",abierta:"Abierta (manual)",cerrada:"Cerrada",final:"Puntos publicados"};
/* estado efectivo: "auto" (o abierta sin manual) sigue el horario abre/cierra */
function estDe(f){const raw=f._estado||"abierta";if(raw==="final"||raw==="cerrada")return raw;if(raw==="abierta"&&f.manual)return "abierta";
  const now=Date.now();if(f.cierra&&now>=Date.parse(f.cierra))return "cerrada";if(f.abre&&now<Date.parse(f.abre))return "proxima";return "abierta"}
const TZ="America/Argentina/Buenos_Aires";
function fmtDT(iso){try{return new Date(iso).toLocaleString("es-AR",{timeZone:TZ,weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).replace(",","")}catch(e){return iso}}
function falta(iso){let ms=Date.parse(iso)-Date.now();if(ms<=0)return "0 min";const d=Math.floor(ms/864e5);ms-=d*864e5;const h=Math.floor(ms/36e5);ms-=h*36e5;const m=Math.floor(ms/6e4);return d?`${d} d ${h} h`:h?`${h} h ${m} min`:`${m} min`}
/* sábado del partido -> abre el lunes anterior 08:00, cierra el sábado 15:25 (hora Argentina) */
function horarios(sab){const [y,mo,da]=sab.split("-").map(Number);const pad=n=>String(n).padStart(2,"0");const lun=new Date(Date.UTC(y,mo-1,da-5));
  return {abre:`${lun.getUTCFullYear()}-${pad(lun.getUTCMonth()+1)}-${pad(lun.getUTCDate())}T08:00:00-03:00`,cierra:`${y}-${pad(mo)}-${pad(da)}T15:25:00-03:00`}}

/* apellidos repetidos en el mismo club: se les agrega la inicial (R. Testoni / F. Testoni) */
let _snMap=null,_snRef=null;
function snDup(p){if(_snRef!==S.plantel){_snRef=S.plantel;_snMap={};for(const q of Object.values(S.plantel||{})){if(!q||q.c)continue;const k=q.d+"|"+surname(q.n||"").toLowerCase();(_snMap[k]=_snMap[k]||[]).push(q)}}
  const l=_snMap[p.d+"|"+surname(p.n||"").toLowerCase()];return l&&l.length>1?l:null}
function surname(n){if(n&&typeof n==="object"){if(n.c&&String(n.c).trim())return String(n.c).trim();const sn=surname(n.n||"");const dup=snDup(n);if(!dup)return sn;
    const first=String(n.n||"").trim().split(/\s+/)[0]||"";const ini=first.charAt(0).toUpperCase()+".";
    return dup.filter(q=>q!==n&&String(q.n||"").trim().charAt(0).toUpperCase()+"."===ini).length?first+" "+sn:ini+" "+sn}const w=String(n||"").trim().split(/\s+/);if(w.length<2)return w[0]||"";let i=1;while(i<w.length-1&&NOMBRES.has(w[i].toLowerCase()))i++;return w.slice(i).join(" ")}

/* ---------- puntos ---------- */
function playerPts(st){if(!st)return 0;let s=0;for(const [k] of STATS)s+=(+st[k]||0)*(+S.pts[k]||0);return s}
function fechaStats(fid){const f=S.fechas.find(x=>x.id===fid);return (f&&f.stats)||{}}
/* puntos de un jugador dentro de un XV: conversiones y penales solo cuentan si es el pateador;
   el capitán duplica todo (drops y Man of the Match incluidos), menos conversiones y penales */
const KICKS=["c","p","d"];
function rolePts(e,pid,st){if(!st)return 0;let base=0,kick=0;
  for(const [k] of STATS){const v=(+st[k]||0)*(+S.pts[k]||0);if(NO_CAP.includes(k)){if(e.kick!==pid)continue;kick+=v}else base+=v}
  return (e.cap===pid?base*2:base)+kick}
function hcPts(e,f){if(!e||!e.hc||!f||!f.res)return 0;return HC_PTS[f.res[e.hc]]||0}
/* foto del cierre: si existe cierres/<fecha>, manda esa copia (no editable por los participantes) */
/* respaldo: si el organizador abre el sitio y una fecha ya cerró sin registro, lo guarda solo */
let _autoBusy=false;
async function autoCierre(){return;if(_autoBusy||!S.isOwner||!S.db||!S.ready||!S.cierresOk)return;
  const now=Date.now();const pend=S.fechas.filter(f=>f.cierra&&now>=Date.parse(f.cierra)&&!snapOf(f.id));if(!pend.length)return;_autoBusy=true;
  try{for(const f of pend){const eq={};for(const [uid,t] of Object.entries(S.equipos)){const en=t&&t.fechas&&t.fechas[f.id];if(en&&en.picks&&Object.keys(en.picks).length)eq[uid]={picks:en.picks,cap:en.cap||null,kick:en.kick||null,hc:en.hc||null,divs:en.divs||{}}}
    const pr={};for(const [uid,d] of Object.entries(S.prode||{})){const en=d&&d.fechas&&d.fechas[f.id];if(en&&Object.keys(en).length)pr[uid]=en}
    await S.db.doc("cierres/"+f.id).set({at:new Date().toISOString(),equipos:eq,prode:pr,auto:true});toast(`Registro al cierre de ${f.nombre} guardado`)}}catch(e){}_autoBusy=false}
function snapOf(fid){return S.cierres&&S.cierres[fid]}
function entryOf(uid,team,fid){const sn=snapOf(fid);if(sn&&uid)return (sn.equipos||{})[uid]||null;return team&&team.fechas?team.fechas[fid]||null:null}
const sig=e=>e?JSON.stringify([e.picks||{},e.cap||null,e.kick||null,e.hc||null]):"";
function changedAfter(uid,team,fid){const sn=snapOf(fid);if(!sn||!uid)return false;const live=team&&team.fechas&&team.fechas[fid];const snap=(sn.equipos||{})[uid];if(!live&&!snap)return false;return sig(live)!==sig(snap)}
function teamFechaPts(team,fid,uid){const e=uid?entryOf(uid,team,fid):(team&&team.fechas&&team.fechas[fid]);if(!e||!e.picks)return 0;const f=S.fechas.find(x=>x.id===fid);if(!f)return 0;const st=f.stats||{};let s=hcPts(e,f);
  for(const slot in e.picks){if(!isXV(slot))continue;const pid=e.picks[slot];if(!pid)continue;s+=rolePts(e,pid,st[pid])}return s}
function finalFechas(){return sortedFechas().filter(f=>f.estado==="final")}
function seasonPlayerPts(pid){let s=0;for(const f of finalFechas())s+=playerPts((f.stats||{})[pid]);return s}

const LOGO_IMG={};function logoImg(k){if(!LOGO_IMG[k]){const i=new Image();i.src=LOGOS[k];LOGO_IMG[k]=i}return LOGO_IMG[k]}
const GAME_TXT={dt:{eye:"Line & Maul",t:'Fantasy <span>Rugby</span>',sub:"Armá tu XV con jugadores de los 14 clubes. Suman los puntos que hacen el fin de semana."},prode:{eye:"Line & Maul",t:'Prode <span>Rugby</span>',sub:"Pronosticá ganador y diferencia de cada partido de la fecha."}};
function renderTabs(){
  document.body.dataset.game=S.game;document.querySelectorAll(".games [data-game]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.game===S.game)));
  const g=GAME_TXT[S.game];const lg=$("#gLogo");if(lg&&lg.dataset.k!==S.game){lg.src=LOGOS[S.game]||LOGOS.dt;lg.dataset.k=S.game}$("#gEye").textContent=g.eye;$("#gTitle").innerHTML=g.t;$("#gSub").textContent=g.sub;
  const t=S.game==="prode"?[["pxv","Mi Prode"],["ptabla","Tabla"],["preglas","Reglas"]]:[["xv","Mi XV"],["tabla","Tabla"],["jug","Jugadores"],["reglas","Reglas"]];if(S.isOwner)t.push(S.game==="prode"?["padmin","Admin"]:["admin","Admin"]);
  if(!t.some(([k])=>k===S.tab))S.tab=t[0][0];
  $("#tabs").innerHTML=t.map(([k,n])=>`<button role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${S.tab===k}">${n}</button>`).join("");

function renderHome(){const h=$("#home");if(!h)return;
  h.innerHTML=`<img class="hlogo" src="${LM_LOGO}" alt="Line & Maul"><div class="hslogan">${esc(HOME_SLOGAN)}</div><div class="hpick">Elegí tu juego</div>

const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

function defaultFecha(){const fs=sortedFechas();const ab=fs.filter(f=>f.estado==="abierta");if(ab.length)return ab[ab.length-1].id;const np=fs.filter(f=>f.estado!=="proxima");if(np.length)return np[np.length-1].id;return fs.length?fs[0].id:null}
function myTeam(){return S.uid?S.equipos[S.uid]:null}
function loadDraft(fid){
  const t=myTeam();const e=snapOf(fid)&&S.uid?entryOf(S.uid,t,fid):(t&&t.fechas&&t.fechas[fid]);S.copiedFrom=null;
  if(snapOf(fid)&&!e){S.draft={picks:{},cap:null,kick:null,hc:null,divs:{}};S.draftKey=fid;S.dirty=false;return}
  if(e){S.draft={picks:Object.assign({},e.picks||{}),cap:e.cap||null,kick:e.kick||null,hc:e.hc||null,divs:Object.assign({},e.divs||{})};freezeDivs()}
  else{
    const f=S.fechas.find(x=>x.id===fid);let prev=null;
    if(f&&f.estado==="abierta"&&t&&t.fechas){for(const pf of sortedFechas().reverse()){if(pf.id!==fid&&t.fechas[pf.id]){prev=pf;break}}}
    if(prev){const pe=t.fechas[prev.id];const picks={};for(const s in (pe.picks||{}))if(S.plantel[pe.picks[s]])picks[s]=pe.picks[s];
      const inP=x=>x&&Object.values(picks).includes(x)?x:null;S.draft={picks,cap:inP(pe.cap),kick:inP(pe.kick),hc:pe.hc&&HCS[pe.hc]?pe.hc:null,divs:Object.assign({},pe.divs||{})};freezeDivs();S.copiedFrom=prev.nombre}
    else S.draft={picks:{},cap:null,kick:null,hc:null,divs:{}};
  }
  S.draftKey=fid;S.dirty=!!S.copiedFrom;
}
function fdiv(pid){const fz=S.draft&&S.draft.divs&&S.draft.divs[pid];if(fz&&DIVS.includes(fz))return fz;const p=S.plantel[pid];return p?p.d:null}
function freezeDivs(){const d={};for(const s in S.draft.picks){const pid=S.draft.picks[s];if(!pid)continue;d[pid]=(S.draft.divs&&S.draft.divs[pid])||(S.plantel[pid]&&S.plantel[pid].d)}S.draft.divs=d}
function divCounts(picks){const c={};DIVS.forEach(d=>c[d]=0);for(const s in picks){const pid=picks[s];if(!S.plantel[pid])continue;const d=fdiv(pid);if(c[d]!=null)c[d]++}return c}

function prevSquad(fid){const t=myTeam();if(!t||!t.fechas||!S.uid)return null;const fs=sortedFechas();const i=fs.findIndex(x=>x.id===fid);
  for(let k=i-1;k>=0;k--){const e=entryOf(S.uid,t,fs[k].id);if(e&&e.picks&&Object.values(e.picks).some(Boolean))return new Set(Object.values(e.picks).filter(p=>p&&S.plantel[p]))}return null}

async function guardarXV(force){
  const f=S.fechas.find(x=>x.id===S.fechaSel);if(!f||f.estado!=="abierta"||!S.uid)return;
  const cnt=divCounts(S.draft.picks);if(DIVS.some(d=>cnt[d]>maxOf(f))){toast(`Hay un club con más de ${maxOf(f)} jugadores. Sacá alguno para guardar.`);return}
  const ci=cambiosInfo();if(ci&&ci.used>ci.max){toast(`Hiciste ${ci.used} cambios de plantel. El máximo es ${ci.max} en esta fecha.`);return}
  const club=(clubDraft()||"").trim();if(!club){toast("Elegí tu club para guardar tu XV");const c=$("#myClub");if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.focus()}return}
  if(!force){const fl=faltantes();if(fl.length){avisoFaltantes(fl);return}}
  const t=myTeam()||{};const nameEl=$("#teamName");const nombre=(t.nombre||"").trim()||(nameEl?nameEl.value:"").trim().slice(0,40);
  const fechas=JSON.parse(JSON.stringify(t.fechas||{}));
  fechas[f.id]={picks:Object.assign({},S.draft.picks),cap:S.draft.cap||null,kick:S.draft.kick||null,hc:S.draft.hc||null,divs:(freezeDivs(),Object.assign({},S.draft.divs)),at:new Date().toISOString()};
  S.saving=true;render();
  try{await S.db.doc("equipos/"+S.uid).set({nombre:nombre||t.nombre||"",fechas,ligas:Array.isArray(t.ligas)?t.ligas:[],club,nombreCambios:+t.nombreCambios||0});S.dirty=false;S.copiedFrom=null;S.nameDraft=null;S.clubDraft=null;toast("XV guardado");festejo()}
  catch(err){toast(err&&err.code==="invalid_argument"?"No se pudo guardar: la fecha ya cerró o se cortó la sesión. Recargá la página.":"No se pudo guardar. Probá de nuevo.")}
  S.saving=false;render();
}

function ligaBar(){const mine=myLigas();if(S.liga==="__club"&&!hasClubTable(myClubSaved()))S.liga=null;if(S.liga&&S.liga!=="__club"&&!mine.includes(S.liga))S.liga=null;const L=S.liga==='__club'?null:S.ligas[S.liga];

function renderTabla(){
  const v=$("#view");const fins=finalFechas();const fs=sortedFechas();
  let teams=Object.entries(S.equipos).filter(([id,t])=>t&&t.fechas&&Object.keys(t.fechas).length);
  const bar=ligaBar();
  if(S.liga==="__club"){const mc=norm(myClubSaved());teams=teams.filter(([id,t])=>norm(t.club)===mc)}else if(S.liga)teams=teams.filter(([id,t])=>Array.isArray(t.ligas)&&t.ligas.includes(S.liga));
  if(!teams.length){v.innerHTML=`<section class="view">${bar}<div class="empty"><h3>Todavía no hay equipos${S.liga==="__club"?" de tu club":S.liga?" en este torneo":""}</h3>${S.liga?"Cuando los integrantes guarden su XV, aparecen acá.":"La tabla aparece cuando la gente guarda su XV y se publican los puntos de una fecha."}</div></section>`;return}
  const mode=S.tablaMode||"general";
  if(mode==="fecha"&&(!S.tablaFecha||!fs.find(f=>f.id===S.tablaFecha)))S.tablaFecha=(fins[fins.length-1]||fs[fs.length-1]||{}).id;
  const fSel=mode==="fecha"?fs.find(f=>f.id===S.tablaFecha):null;
  const pub=!fSel||fSel.estado==="final";
  const last=fins[fins.length-1];
  const total=(t,id)=>fins.reduce((s,f)=>s+teamFechaPts(t,f.id,id),0);
  let rows=teams.map(([id,t])=>{const ef=fSel?entryOf(id,t,fSel.id):null;return {id,t,tot:total(t,id),fp:fSel?teamFechaPts(t,fSel.id,id):0,last:last?teamFechaPts(t,last.id,id):0,armo:fSel?!!(ef&&Object.keys(ef.picks||{}).length):true,late:fSel?changedAfter(id,t,fSel.id):false}});
  if(fSel)rows=rows.filter(r=>r.armo);
  const key=r=>mode==="fecha"?r.fp:r.tot;
  rows.sort((a,b)=>(pub?key(b)-key(a)||b.tot-a.tot:0)||String(a.t.nombre||"").localeCompare(String(b.t.nombre||"")));
  const detailF=fSel?fSel.id:(last&&last.id);
  /* flechas: posición en la general antes de la última fecha publicada vs ahora */
  const mv={};
  if(mode==="general"&&fins.length>=2){const prevF=fins.slice(0,-1);
    const ranks=list=>{const m={};let pv=null,rk=0;list.forEach((x,i)=>{if(x.v!==pv){rk=i+1;pv=x.v}m[x.id]=rk});return m};
    const now=ranks(rows.map(r=>({id:r.id,v:r.tot})).sort((a,b)=>b.v-a.v));
    const before=ranks(rows.map(r=>({id:r.id,v:prevF.reduce((s2,f)=>s2+teamFechaPts(r.t,f.id,r.id),0),played:prevF.some(f=>entryOf(r.id,r.t,f.id))})).sort((a,b)=>b.v-a.v));
    const playedBefore=new Set(rows.filter(r=>prevF.some(f=>entryOf(r.id,r.t,f.id))).map(r=>r.id));
    rows.forEach(r=>{mv[r.id]=playedBefore.has(r.id)?before[r.id]-now[r.id]:"new"})}
  const arrow=id=>{const d=mv[id];if(d===undefined)return "";if(d==="new")return `<span class="mv new" title="Primera fecha con puntos">NUEVO</span>`;if(d>0)return `<span class="mv up" title="Subió ${d}">▲${d}</span>`;if(d<0)return `<span class="mv down" title="Bajó ${-d}">▼${-d}</span>`;return `<span class="mv eq" title="Mantiene el puesto">=</span>`};
  /* podio */
  const showPod=pub&&rows.length>=2&&(mode==="fecha"||fins.length>0)&&key(rows[0])!==0;
  const top=showPod?rows.slice(0,3):[];
  const podCell=(r,pos)=>r?`<div class="pod p${pos}" data-open="${esc(r.id)}"><div class="podtop"><div class="podname">${esc(r.t.nombre||"Equipo sin nombre")}</div><div class="podwho small" data-who="${esc(r.id)}"></div></div><div class="podbase"><span class="podpos">${pos}°</span><span class="podpts num">${key(r)}<small> pts</small></span></div></div>`:"";
  const podium=top.length?`<div class="podium">${podCell(top[1],2)}${podCell(top[0],1)}${podCell(top[2],3)}</div>`:"";
  const bF=mode==="fecha"?(fSel&&fSel.estado==="final"?fSel.id:null):(last&&last.id);const BADGES=bF?insignias(bF):{};
  const cols=4;let prevPts=null,rank=0;
  const body=rows.map((r,i)=>{if(key(r)!==prevPts){rank=i+1;prevPts=key(r)}
    const open=S.open===r.id;
    const c3=mode==="fecha"?(pub?r.fp:"–"):(last?r.last:"–");const c4=r.tot;
    return `<tr class="clk${r.id===S.uid?" me":""}" data-open="${esc(r.id)}" tabindex="0" aria-expanded="${open}"><td class="rank num">${pub?rank:"·"}${arrow(r.id)}</td><td><div style="font-weight:600;white-space:normal">${badgeHtml(BADGES[r.id])}${esc(r.t.nombre||"Equipo sin nombre")}${r.id===S.uid?' <span class="tag">Vos</span>':""}</div><div class="small muted"><span class="who" data-who="${esc(r.id)}"></span>${hasClubTable(r.t.club)?`<span> · ${esc(r.t.club)}</span>`:""}</div></td>
      ${mode==="fecha"?`<td class="r big num">${c3}</td><td class="r num muted">${c4}</td>`:`<td class="r num muted">${c3}</td><td class="r big num">${c4}</td>`}</tr>
    ${open?`<tr class="detail"><td colspan="${cols}">${detailHtml(r.t,detailF,r.id)}</td></tr>`:""}`}).join("");
  const head=mode==="fecha"?`<th class="r">${fSel?esc(fSel.nombre):"Fecha"}</th><th class="r">Total</th>`:`<th class="r">${last?esc(last.nombre):"Últ."}</th><th class="r">Total</th>`;
  v.innerHTML=`<section class="view">
    ${bar}
    <div class="seg" role="group" aria-label="Tipo de tabla"><button data-tmode="general" aria-pressed="${mode==="general"}">General</button><button data-tmode="fecha" aria-pressed="${mode==="fecha"}">Por fecha</button></div>
    ${mode==="fecha"?`<div class="chips" role="group" aria-label="Fecha">${fs.map(f=>`<button class="chip" data-tfecha="${esc(f.id)}" aria-pressed="${fSel&&fSel.id===f.id}"><span class="dot ${f.estado}"></span>${esc(f.nombre)}</button>`).join("")}</div>`:""}
    ${mode==="general"&&!fins.length?`<div class="banner">Todavía no se publicaron puntos. La tabla se ordena cuando se publique la primera fecha.</div>`:""}
    ${fSel&&!pub?`<div class="banner"><span class="dot ${fSel.estado}"></span>Los puntos de ${esc(fSel.nombre)} todavía no se publicaron. Abajo están los equipos que armaron XV.</div>`:""}
    ${podium}
    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Equipo</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="small muted" style="margin:0">Tocá un equipo para ver su XV${detailF?" de "+esc((S.fechas.find(f=>f.id===detailF)||{}).nombre||""):""}.</p>`:`<div class="empty">Nadie armó equipo para esta fecha.</div>`}
  </section>`;
  fillNames(rows.map(r=>r.id));
}
async function fillNames(ids){if(!S.user||!ids.length)return;try{const ps=await S.user.profiles(ids);document.querySelectorAll("[data-who]").forEach(el=>{const p=ps[el.dataset.who];el.textContent=p&&p.name?p.name:""})}catch(e){}}
function detailHtml(t,fid,uid){
  if(!fid)return `<span class="muted small">Sin fechas con puntos todavía.</span>`;
  const e=entryOf(uid,t,fid);if(!e||!e.picks||!Object.keys(e.picks).length)return `<span class="muted small">No armó equipo para esta fecha.</span>`;
  const f=S.fechas.find(x=>x.id===fid);const pub=f&&f.estado==="final";const st=fechaStats(fid);
  if(f&&f.estado==="abierta"&&t!==myTeam()&&!S.isOwner)return `<div class="small muted" style="display:flex;gap:8px;align-items:center"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>Este XV se ve cuando cierre ${esc(f.nombre)}. Así nadie copia.</div>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px">${Array.from({length:15},(_,i)=>i+1).map(s=>{const pid=e.picks[s];const p=S.plantel[pid];if(!p)return `<div class="small muted">#${s} —</div>`;
    const bd=ROLES.filter(r=>e[r.k]===pid).map(r=>`<span class="rb ${r.k}">${r.b}</span>`).join(" ");
    return `<div class="small row" style="justify-content:space-between;flex-wrap:nowrap;gap:6px"><span>#${s} ${esc(p.n)} ${bd}</span><b class="num">${pub?rolePts(e,pid,st[pid]):"–"}</b></div>`}).join("")}${e.hc?`<div class="small row" style="justify-content:space-between;flex-wrap:nowrap;gap:6px"><span><span class="rb hc">HC</span> ${coachOf(e.hc)?esc(coachOf(e.hc))+" · ":""}${esc(e.hc)}</span><b class="num">${pub?hcPts(e,f):"–"}</b></div>`:""}</div>${(()=>{const b=BENCH.map(s=>S.plantel[e.picks[s]]).filter(Boolean);return b.length?`<div class="small muted" style="margin-top:6px">Suplentes: ${b.map(p=>esc(surname(p))).join(", ")}</div>`:""})()}`;
}

/* ---------- JUGADORES ---------- */
function seasonTotals(){const tot={};for(const pid in S.plantel)tot[pid]={t:0,o:0,c:0,p:0,d:0,a:0,r:0,m:0};
  for(const f of finalFechas()){const st=f.stats||{};for(const pid in st){if(!tot[pid])continue;for(const [k] of STATS)tot[pid][k]+=(+st[pid][k]||0)}}return tot}
function renderJug(){
  const mode=S.jugMode||"puntos";const dv=S.jugDiv||"Todas";const tot=seasonTotals();const P=S.pts;const nf=finalFechas().length;
  let rows=Object.entries(S.plantel).filter(([id,p])=>dv==="Todas"||p.d===dv).map(([id,p])=>{const x=tot[id];
    const kick=x.c*(+P.c||0)+x.p*(+P.p||0)+x.d*(+P.d||0);const pts=x.t*(+P.t||0)+x.o*(+P.o||0)+x.a*(+P.a||0)+x.r*(+P.r||0)+x.m*(+P.m||0);return {id,p,x,pts,kick}});
  const key=r=>mode==="puntos"?r.pts:r.kick;
  rows.sort((a,b)=>key(b)-key(a)||(mode==="puntos"?b.x.t-a.x.t:(b.x.c+b.x.p+b.x.d)-(a.x.c+a.x.p+a.x.d))||a.p.n.localeCompare(b.p.n));

      :`<tr><td class="rank num">${rank}</td>${who}<td class="r num">${z(r.x.c)}</td><td class="r num">${z(r.x.p)}</td><td class="r num">${z(r.x.d)}</td><td class="r big num">${r.kick}</td></tr>`}).join("");

    :`<th>#</th><th>Jugador</th><th class="r" title="Conversiones">Conv.</th><th class="r" title="Penales">Pen.</th><th class="r">Drops</th><th class="r">Pts</th>`;
  $("#view").innerHTML=`<section class="view">

    ${rows.length?`<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`:`<div class="empty">No hay jugadores cargados${dv!=="Todas"?" en "+esc(dv):""}.</div>`}
  </section>`;
}

function parsePuesto(s){const n=norm(s);if(/^\d{1,2}$/.test(n))return SLOT_GROUP[+n]||null;
  const m=[["pilar","PIL"],["hook","HOO"],["segunda","SEG"],["2da","SEG"],["2a","SEG"],["lock","SEG"],["octavo","TER"],["tercera","TER"],["3ra","TER"],["medio","MED"],["apertura","APE"],["centro","CEN"],["wing","WIN"],["full","FB"],["zaguero","FB"],["ala","TER"]];
  for(const [k,g] of m)if(n.startsWith(k)||n.includes(" "+k))return g;
  for(const g in GROUPS)if(norm(GROUPS[g].n)===n)return g;return null}
function parseDiv(s){const n=norm(s).replace(/[\s\-._]/g,"");const m={alumni:"Alumni",atleticodelrosario:"Atlético del Rosario",atleticorosario:"Atlético del Rosario",adr:"Atlético del Rosario",belgrano:"Belgrano",belgranoathletic:"Belgrano",buenosaires:"Buenos Aires",bacrc:"Buenos Aires",casi:"CASI",champagnat:"Champagnat",cuba:"CUBA",hindu:"Hindú",hinduclub:"Hindú",laplata:"La Plata",lprc:"La Plata",losmatreros:"Los Matreros",matreros:"Los Matreros",lostilos:"Los Tilos",tilos:"Los Tilos",newman:"Newman",regatas:"Regatas",regatasbellavista:"Regatas",sic:"SIC"};return m[n]||null}
function newId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- métricas (admin) ---------- */
function mUsers(){const ids=new Set([...Object.keys(S.equipos||{}),...Object.keys(S.prode||{})]);return [...ids]}
function mSince(uid){const t=(S.equipos||{})[uid];if(t&&t.creado)return Date.parse(t.creado);let m=Infinity;
  if(t&&t.fechas)for(const e of Object.values(t.fechas)){const a=e&&e.at&&Date.parse(e.at);if(a&&a<m)m=a}
  const pr=(S.prode||{})[uid];if(pr&&pr.at){const a=Date.parse(pr.at);if(a&&a<m)m=a}return m===Infinity?null:m}
const mHasXV=(uid,fid)=>{const e=entryOf(uid,(S.equipos||{})[uid],fid);return !!(e&&e.picks&&Object.values(e.picks).some(Boolean))};
const mHasPr=(uid,fid)=>{const pr=(S.prode||{})[uid];const d=pr&&pr.fechas&&pr.fechas[fid];return !!(d&&Object.keys(d).length)};
const mEverXV=uid=>{const t=(S.equipos||{})[uid];return !!(t&&t.fechas&&Object.keys(t.fechas).some(f=>mHasXV(uid,f)))};
const mEverPr=uid=>{const pr=(S.prode||{})[uid];return !!(pr&&pr.fechas&&Object.keys(pr.fechas).some(f=>mHasPr(uid,f)))};
function mMetrics(){const users=mUsers();const fs=sortedFechas().filter(f=>f.estado!=="proxima");const cur=fs.length?(S.fechas.find(x=>x.id===defaultFecha())||fs[fs.length-1]):null;
  const xvAll=users.filter(mEverXV).length,prAll=users.filter(mEverPr).length;
  const perF=fs.map(f=>({f,xv:users.filter(u=>mHasXV(u,f.id)).length,pr:users.filter(u=>mHasPr(u,f.id)).length}));
  const now=Date.now(),W=7*864e5;const weeks=[];for(let i=9;i>=0;i--){const a=now-(i+1)*W,b=now-i*W;weeks.push({a,b,n:users.filter(u=>{const x=mSince(u);return x&&x>=a&&x<b}).length})}
  const new7=weeks[9].n,new30=users.filter(u=>{const x=mSince(u);return x&&x>=now-30*864e5}).length;
  const clubs={};users.forEach(u=>{const c=((S.equipos||{})[u]||{}).club;if(c)clubs[c]=(clubs[c]||0)+1});
  const ligas=Object.entries(S.ligas||{}).map(([code,L])=>({code,L,n:users.filter(u=>(((S.equipos||{})[u]||{}).ligas||[]).includes(code)).length}));
  return {users,cur,xvAll,prAll,perF,weeks,new7,new30,clubs,ligas}}
/* jugadores más elegidos (solo titulares del XV) */
function mPlayers(m){const scope=S.mScope||"fecha";const fids=scope==="fecha"&&m.cur?[m.cur.id]:m.perF.map(x=>x.f.id);
  const cnt={},byG={},cap={},hc={};let teams=0;
  for(const u of m.users){const t=(S.equipos||{})[u];for(const fid of fids){const e=entryOf(u,t,fid);if(!e||!e.picks)continue;let any=false;
    for(const sl in e.picks){if(!isXV(sl))continue;const pid=e.picks[sl];if(!pid||!S.plantel[pid])continue;any=true;cnt[pid]=(cnt[pid]||0)+1;const g=SLOT_GROUP[sl];(byG[g]=byG[g]||{})[pid]=(byG[g][pid]||0)+1}
    if(any){teams++;if(e.cap&&S.plantel[e.cap])cap[e.cap]=(cap[e.cap]||0)+1;if(e.hc)hc[e.hc]=(hc[e.hc]||0)+1}}}
  return {scope,teams,cnt,byG,cap,hc}}
function mPlayersHtml(m){const P=mPlayers(m);const view=S.mView||"general";const pc=n=>P.teams?Math.round(n*100/P.teams)+"%":"";
  const top=(obj,n)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const row=(pid,n,i)=>{const p=S.plantel[pid];return `<div class="mprow"><span class="num muted">${i+1}</span><span class="mpn"><b>${esc(p.n)}</b><small>${esc(shortClub(p.d))} · ${esc(posNames(p))}</small></span><span class="mpv"><b class="num">${n}</b><small>${pc(n)}</small></span></div>`};

    body+=`<div class="mpsub"><h4>Head Coach más elegidos</h4>${h.map(([cl,n],i)=>`<div class="mprow"><span class="num muted">${i+1}</span><span class="mpn"><b>${esc(coachOf(cl)||cl)}</b><small>${esc(cl)}</small></span><span class="mpv"><b class="num">${n}</b><small>${pc(n)}</small></span></div>`).join("")||'<p class="muted small">—</p>'}</div>`}
  else if(view==="puesto")body=Object.keys(GROUPS).map(g=>{const l=top(P.byG[g]||{},3);return l.length?`<div class="mpsub"><h4>${GROUPS[g].n}</h4>${l.map(([pid,n],i)=>row(pid,n,i)).join("")}</div>`:""}).join("");
  else body=DIVS.map(d=>{const l=top(Object.fromEntries(Object.entries(P.cnt).filter(([pid])=>S.plantel[pid]&&S.plantel[pid].d===d)),3);return l.length?`<div class="mpsub"><h4>${esc(d)}</h4>${l.map(([pid,n],i)=>row(pid,n,i)).join("")}</div>`:""}).join("");

  <div class="chips" role="group">${chip("mview","general","General",view)}${chip("mview","puesto","Por puesto",view)}${chip("mview","club","Por club",view)}</div>
  <p class="small muted" style="margin:0">Solo titulares del XV. El % es sobre ${P.teams} equipo${P.teams===1?"":"s"} armado${P.teams===1?"":"s"}${P.scope==="temp"?" (sumando todas las fechas)":""}.</p><div class="mplist">${body}</div></div>`}

  ${cur?`<div class="card"><h3>${esc(cur.nombre)} (actual)</h3><div class="mgrid">${card(curXV,"XV armados",pc(curXV,m.users.length))}${card(curPr,"Prodes",pc(curPr,m.users.length))}</div></div>`:""}
  <div class="card"><h3>Nuevos usuarios por semana</h3><div class="mbars">${bars}</div><p class="small muted" style="margin:6px 0 0">Últimas 10 semanas. Pasá el dedo o el mouse por cada barra para ver el total acumulado.</p></div>
  ${fRows?`<div class="card"><h3>Participación por fecha</h3><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th class="r">Fantasy</th><th class="r">Prode</th><th class="r">Activos</th></tr></thead><tbody>${fRows}</tbody></table></div></div>`:""}
  ${clubs.length?`<div class="card"><h3>Usuarios por club</h3><div class="mclubs">${clubs.map(([c,n])=>`<div><span>${esc(c)}</span><b class="num">${n}</b></div>`).join("")}</div></div>`:""}
  ${mPlayersHtml(m)}
  <div class="card"><h3>Usuarios</h3><input type="text" id="mq" placeholder="Buscar por equipo o club" autocomplete="off"><div class="mlist">${uRows||`<p class="muted small">Todavía no hay usuarios.</p>`}</div>${users.length>300?`<p class="small muted">Mostrando los 300 más nuevos de ${users.length}.</p>`:""}<p class="small muted" style="margin:6px 0 0">Tocá un usuario para ver su XV de la fecha actual (como admin lo ves aunque la fecha esté abierta).</p></div>

function renderAdmin(){
  if(!S.isOwner){$("#view").innerHTML="";return}

$("#view").addEventListener("click",async e=>{
  if(!S.isOwner||S.tab!=="admin")return;

    $("#bulk").value="";toast(`${Object.keys(add).length} jugadores cargados`+(errs.length?` · revisá líneas ${errs.join(", ")}`:""));return}

  const dp=e.target.closest("[data-delp]");if(dp){const pid=dp.dataset.delp;if(dp.dataset.arm!=="1"){dp.dataset.arm="1";dp.textContent="Confirmar";setTimeout(()=>{if(dp.isConnected){dp.dataset.arm="";dp.textContent="Borrar"}},3000);return}
    const np=Object.assign({},S.plantel);delete np[pid];await S.db.doc("config/plantel").set({players:np});toast("Jugador borrado");return}
  if(id==="addFecha"){const n=$("#fNombre").value.trim();if(!n){toast("Poné un nombre a la fecha");return}const sab=$("#fSab").value;
    const doc={nombre:n.slice(0,40),orden:Date.now(),stats:{},max:parseInt($("#fMax").value,10)||MAXDIV};if(sab){const h=horarios(sab);Object.assign(doc,h,{estado:"auto",orden:Date.parse(h.cierra)})}else{doc.estado="abierta";doc.manual=true}

  const sn=e.target.closest("[data-snap]");if(sn){const fid=sn.dataset.snap;if(snapOf(fid)&&sn.dataset.arm!=="1"){sn.dataset.arm="1";sn.textContent="¿Reemplazar registro?";setTimeout(()=>{if(sn.isConnected){sn.dataset.arm="";sn.textContent="Rehacer registro"}},3000);return}
    const eq={};for(const [uid,t] of Object.entries(S.equipos)){const en=t&&t.fechas&&t.fechas[fid];if(en&&en.picks&&Object.keys(en.picks).length)eq[uid]={picks:en.picks,cap:en.cap||null,kick:en.kick||null,hc:en.hc||null,divs:en.divs||{}}}
    const pr={};for(const [uid,d] of Object.entries(S.prode||{})){const en=d&&d.fechas&&d.fechas[fid];if(en&&Object.keys(en).length)pr[uid]=en}

/* ==================== PRODE ==================== */
/* fechas/<id>.partidos = [{id,l,v,c}] (c = competencia, por defecto top14) · fechas/<id>.cn = {comp: "Fecha 24"} nombre de la fecha en esa competencia
   fechas/<id>.marcador = {mid:{l,v}} · prode/<uid> = {comps:[...], fechas:{fid:{mid:{w:"L"|"V"|"E",d}}}} */
/* ganador + cercanía: exacto 5; errás por 1-5 → 3; por 6-10 → 2; por más de 10 → 1; empate acertado 8; pleno +5 por competencia */
const PR_EXACTO=5,PR_CERCA=3,PR_MEDIO=2,PR_GANADOR=1,PR_EMPATE=8,PR_PLENO=5;
const PR_COMPS=[["top14","Top 14"],["a","Primera A"]];
const COMP_N=Object.fromEntries(PR_COMPS);const COMP_IDS=PR_COMPS.map(c=>c[0]);
const PRIMERA_A=["Champagnat","Curupaytí","Deportiva Francesa","GEBA","Hurling","Lomas Athletic","Olivos","Pucará","Pueyrredón","San Albano","San Andrés","San Cirano","San Fernando","Universitario de La Plata"];
const COMP_CLUBS={top14:DIVS,a:PRIMERA_A};
Object.assign(SHORT,{"Universitario de La Plata":"Univ. La Plata","Deportiva Francesa":"Dep. Francesa","Lomas Athletic":"Lomas"});
const compOf=m=>COMP_N[m&&m.c]?m.c:"top14";
/* en el Prode las fechas se nombran por día (cada competencia tiene su propio número) */
function prDia(f){if(!f||!f.cierra)return f?f.nombre:"";const d=new Date(Date.parse(f.cierra)-3*3600e3);if(isNaN(d))return f.nombre;return ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][d.getUTCDay()]+" "+d.getUTCDate()+"/"+(d.getUTCMonth()+1)}
function compFecha(f,c){return (f&&f.cn&&f.cn[c])||(f?f.nombre:"")}
function prErr(p,r){return Math.abs(Math.abs(+p.d||0)-Math.abs(r.l-r.v))}
function prPartidos(f,comps){const all=(f&&Array.isArray(f.partidos)?f.partidos:[]).filter(m=>m&&m.id&&m.l&&m.v);return comps?all.filter(m=>comps.includes(compOf(m))):all}
function prComps(f){return COMP_IDS.filter(c=>prPartidos(f,[c]).length)}
function prMarc(f,mid){const m=f&&f.marcador&&f.marcador[mid];return m&&m.l!==""&&m.v!==""&&m.l!=null&&m.v!=null?{l:+m.l,v:+m.v}:null}
function prPts(p,r){if(!p||!p.w||!r)return null;const diff=r.l-r.v;
  if(p.w==="E")return diff===0?PR_EMPATE:0;if(diff===0)return 0;
  const win=diff>0?"L":"V";if(p.w!==win)return 0;if(!(+p.d>0))return PR_GANADOR;const e=prErr(p,r);
  return e===0?PR_EXACTO:e<=5?PR_CERCA:e<=10?PR_MEDIO:PR_GANADOR}
function prSnap(fid){const sn=snapOf(fid);return sn&&sn.prode?sn.prode:null}
function prEntry(uid,fid){const sn=prSnap(fid);if(sn&&uid)return sn[uid]||null;const d=S.prode[uid];return d&&d.fechas?d.fechas[fid]||null:null}
/* puntos de uid en la fecha f sumando las competencias pedidas; el pleno es por competencia */
function prFechaPts(uid,f,comps){comps=comps||COMP_IDS;const e=prEntry(uid,f.id);const out={pts:0,plenos:[],det:{}};if(!e)return out;
  for(const c of comps){const ms=prPartidos(f,[c]);if(!ms.length)continue;let ok=0,withRes=0;
    for(const m of ms){const r=prMarc(f,m.id);if(!r)continue;withRes++;const p=prPts(e[m.id],r);out.det[m.id]=p;if(p)out.pts+=p;if(p>0)ok++}
    if(withRes===ms.length&&ok===ms.length){out.pts+=PR_PLENO;out.plenos.push(c)}}
  return out}
function prPlayedIn(uid,comps){const fs=prFechas();return fs.some(f=>{const e=prEntry(uid,f.id);return e&&prPartidos(f,comps).some(m=>e[m.id]&&e[m.id].w)})}
function prFechas(){return sortedFechas().filter(f=>prPartidos(f).length)}
function prDefaultFecha(){const fs=prFechas();const ab=fs.filter(f=>f.estado==="abierta");if(ab.length)return ab[0].id;const np=fs.filter(f=>f.estado!=="proxima");if(np.length)return np[np.length-1].id;return fs.length?fs[0].id:null}
function myComps(){if(S.prCompsDraft)return S.prCompsDraft;const d=S.prode[S.uid];const c=d&&Array.isArray(d.comps)?d.comps.filter(x=>COMP_N[x]):null;return c&&c.length?c:COMP_IDS.slice()}

function prLoadDraft(fid){const e=prEntry(S.uid,fid);S.prDraft=JSON.parse(JSON.stringify(e||{}));S.prKey=fid;S.prDirty=false}
function prCard(f,m,editable){const p=S.prDraft[m.id]||{};const r=prMarc(f,m.id);const pts=r&&f.estado==="final"?prPts(p,r):null;
  const btn=(w,label)=>`<button class="prbtn${p.w===w?" on":""}" data-prw="${esc(m.id)}" data-w="${w}" ${editable?"":"disabled"}>${label}</button>`;
  const needD=(p.w==="L"||p.w==="V")&&f.estado!=="final";
  return `<div class="prm card">
    <div class="prteams"><span class="prteam"><svg viewBox="0 0 64 60" aria-hidden="true">${miniKit(m.l)}</svg><b>${esc(shortClub(m.l))}</b></span>
      ${r?`<span class="prscore num">${r.l} – ${r.v}</span>`:`<span class="prvs">vs</span>`}
      <span class="prteam r"><b>${esc(shortClub(m.v))}</b><svg viewBox="0 0 64 60" aria-hidden="true">${miniKit(m.v)}</svg></span></div>
    <div class="prbtns">${btn("L","Gana "+esc(shortClub(m.l)))}${btn("E","Empate")}${btn("V","Gana "+esc(shortClub(m.v)))}</div>
    ${needD?`<div class="prdiff"><span class="small muted">¿Por cuántos?</span><div class="stepper"><button class="btn sm" data-prd="${esc(m.id)}" data-step="-1" ${editable?"":"disabled"} aria-label="Menos">−</button><input type="number" inputmode="numeric" min="1" max="99" class="num" data-prdin="${esc(m.id)}" value="${p.d||""}" placeholder="–" ${editable?"":"disabled"} aria-label="Diferencia"><button class="btn sm" data-prd="${esc(m.id)}" data-step="1" ${editable?"":"disabled"} aria-label="Más">+</button></div></div>`:""}
    ${r&&f.estado==="final"?(()=>{const real=r.l===r.v?"Empate":`${esc(shortClub(r.l>r.v?m.l:m.v))} por ${Math.abs(r.l-r.v)}`;
      const mine=!p.w?"—":p.w==="E"?"Empate":`${esc(shortClub(p.w==="L"?m.l:m.v))} por ${p.d||"?"}`;
      const why=!p.w?"Sin pronóstico":pts===PR_EMPATE&&p.w==="E"?"Empate acertado":pts===0?"Erraste el ganador":pts===PR_EXACTO?"Exacto":(+p.d>0?`Erraste por ${prErr(p,r)}`:"Ganador");
      return `<div class="prres"><div class="prbox"><span>Pusiste</span><b>${mine}</b></div><div class="prbox"><span>Fue</span><b>${real}</b></div><div class="prbox pts ${pts>0?"pos":"zero"}"><span>Sumás</span><b class="num">${pts>0?"+":""}${pts||0}</b><small>${why}</small></div></div>`})():""}
  </div>`}
function renderPXV(){
  const v=$("#view");const fs=prFechas();

    return `<div class="comphd"><h2>${esc(COMP_N[c])}</h2><span class="small muted">${esc(compFecha(f,c))} · ${cm.length} partidos</span></div>

  const ok=r=>{if(r&&r.error)throw r.error;return r};
  async function setEquipo(uid,d){const prev=(cache.equipos||{})[uid]||{fechas:{},ligas:[]};
    ok(await sb.from("profiles").upsert({id:uid,equipo:d.nombre||null,club:d.club||null},{onConflict:"id"}));
    const ch=Object.keys(d.fechas||{}).filter(fid=>J(d.fechas[fid])!==J(prev.fechas[fid]));
    if(ch.length)ok(await sb.from("equipos").upsert(ch.map(fid=>({user_id:uid,fecha_id:fid,data:d.fechas[fid],updated_at:new Date().toISOString()})),{onConflict:"user_id,fecha_id"}));
    const nl=Array.isArray(d.ligas)?d.ligas:[];const add=nl.filter(c=>!prev.ligas.includes(c)),del=prev.ligas.filter(c=>!nl.includes(c));
    if(add.length)ok(await sb.from("liga_miembros").insert(add.map(code=>({code,user_id:uid}))));
    for(const code of del)ok(await sb.from("liga_miembros").delete().eq("code",code).eq("user_id",uid));
    await refresh("equipos")}
  async function setProde(uid,d){const prev=(cache.prode||{})[uid]||{fechas:{},comps:null};const comps=Array.isArray(d.comps)?d.comps:[];
    const compsCh=J(comps)!==J(prev.comps||[]);
    const ch=Object.keys(d.fechas||{}).filter(fid=>J(d.fechas[fid])!==J(prev.fechas[fid])||(compsCh&&fechaAbiertaLocal(fid)));
    if(ch.length)ok(await sb.from("prode").upsert(ch.map(fid=>({user_id:uid,fecha_id:fid,data:d.fechas[fid],comps,updated_at:new Date().toISOString()})),{onConflict:"user_id,fecha_id"}));
    await refresh("prode")}
  async function setLigasOwner(uid,d){const prev=((cache.ligas||{})[uid]||{torneos:{}}).torneos;const now=d.torneos||{};
    const add=Object.keys(now).filter(c=>!prev[c]),del=Object.keys(prev).filter(c=>!now[c]);
    if(add.length)ok(await sb.from("ligas").insert(add.map(code=>({code,juego:now[code].juego==="prode"?"prode":"dt",nombre:String(now[code].nombre||"Torneo").slice(0,30),comps:Array.isArray(now[code].comps)?now[code].comps:[],owner:uid}))));
    for(const code of del)ok(await sb.from("ligas").delete().eq("code",code));
    await refresh("ligas")}
  function fechaRow(id,data){return {id,data,abre:data.abre||null,cierra:data.cierra||null,updated_at:new Date().toISOString()}}
  function doc(path){const [col,id]=path.split("/");return {
    onSnapshot(cb,err){sub(col,id,cb,err);return ()=>{}},
    async set(data){
      if(col==="config"){ok(await sb.from("config").upsert({key:id,data,updated_at:new Date().toISOString()},{onConflict:"key"}));return refresh("config")}
      if(col==="fechas"){ok(await sb.from("fechas").upsert(fechaRow(id,data),{onConflict:"id"}));return refresh("fechas")}
      if(col==="equipos")return setEquipo(id,data);
      if(col==="prode")return setProde(id,data);
      if(col==="ligas")return setLigasOwner(id,data);
      /* cierres: ya no hace falta, la base no deja cambiar nada después del cierre */},
    async update(part){
      if(col==="fechas"){const {data:row,error}=await sb.from("fechas").select("data").eq("id",id).maybeSingle();if(error)throw error;const data=Object.assign({},row&&row.data||{},part);ok(await sb.from("fechas").upsert(fechaRow(id,data),{onConflict:"id"}));return refresh("fechas")}
      if(col==="config"){const data=Object.assign({},(cache.config||{})[id]||{},part);return doc(path).set(data)}},
    async delete(){if(col==="fechas"){ok(await sb.from("fechas").delete().eq("id",id));return refresh("fechas")}if(col==="config"){ok(await sb.from("config").delete().eq("key",id));return refresh("config")}}
  }}
  function collection(col){return {
    onSnapshot(cb,err){sub(col,null,cb,err);return ()=>{}},
    async add(data){const id="f"+Date.now().toString(36);await doc(col+"/"+id).set(data);return {id}}
  }}
  function refreshAll(){return Promise.all(Object.keys(subs).map(refresh))}
  return {doc,collection,refresh,refreshAll,cache}
}
const lmUser={async profiles(ids){if(!ids.length)return {};const {data,error}=await sb.from("profiles").select("id,nombre").in("id",ids);if(error)return {};const m={};(data||[]).forEach(p=>m[p.id]={name:p.nombre||""});return m}};
/* descarga de la placa (antes la daba Claude) */
const lmDownloads={async save({filename,data}){const url=URL.createObjectURL(data);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}};

/* ---------- cuenta: ingresar / crear / recuperar ---------- */
S.me=null;
async function applySession(session){const u=session&&session.user?session.user:null;const uid=u?u.id:null;
  if(uid===S.uid&&S._sessOk)return;S._sessOk=true;S.uid=uid;S.isOwner=false;S.me=null;
  if(u){try{let {data:p}=await sb.from("profiles").select("id,nombre,equipo,club").eq("id",uid).maybeSingle();
      if(!p){const nombre=((u.user_metadata&&u.user_metadata.nombre)||(u.email||"").split("@")[0]).slice(0,40);await sb.from("profiles").insert({id:uid,nombre});p={id:uid,nombre}}
      S.me={email:u.email,nombre:p.nombre||""}}catch(e){S.me={email:u.email,nombre:""}}
    try{const {data}=await sb.rpc("is_admin");S.isOwner=!!data}catch(e){}}
  renderAuthBtn();if(S.db)await S.db.refreshAll();render()}
function renderAuthBtn(){const b=$("#authBtn");if(!b)return;b.hidden=!sb;b.textContent=S.uid?((S.me&&S.me.nombre)||"Mi cuenta").split(" ")[0]:"Ingresar";b.setAttribute("aria-label",S.uid?"Mi cuenta":"Ingresar o crear cuenta")}
function openAuth(mode){const el=$("#sheet");el.hidden=false;sheetRole="auth";S.authMode=mode||(S.uid?"cuenta":"in");drawAuth()}
function drawAuth(){const m=S.authMode;const el=$("#sheet");
  const tit={in:"Ingresar",up:"Crear cuenta",olvide:"Recuperar contraseña",nueva:"Nueva contraseña",cuenta:"Mi cuenta",mail:"Revisá tu mail"}[m];
  let body="";
  if(m==="in")body=`<label class="f">Mail<input type="email" id="auEmail" autocomplete="email"></label><label class="f">Contraseña<input type="password" id="auPass" autocomplete="current-password"></label><button class="btn primary" id="auGo">Ingresar</button><div class="row" style="justify-content:space-between"><button class="btn sm" data-amode="up">Crear cuenta</button><button class="btn sm" data-amode="olvide">Me olvidé la contraseña</button></div>`;
  if(m==="up")body=`<label class="f">Nombre y apellido<input type="text" id="auNombre" maxlength="40" autocomplete="name"></label><label class="f">Mail<input type="email" id="auEmail" autocomplete="email"></label><label class="f">Contraseña (mínimo 6)<input type="password" id="auPass" autocomplete="new-password"></label><button class="btn primary" id="auGo">Crear cuenta</button><button class="btn sm" data-amode="in">Ya tengo cuenta</button>`;
  if(m==="olvide")body=`<label class="f">Mail<input type="email" id="auEmail" autocomplete="email"></label><button class="btn primary" id="auGo">Mandarme el link</button><button class="btn sm" data-amode="in">Volver</button>`;
  if(m==="nueva")body=`<label class="f">Nueva contraseña (mínimo 6)<input type="password" id="auPass" autocomplete="new-password"></label><button class="btn primary" id="auGo">Guardar contraseña</button>`;
  if(m==="mail")body=`<p style="margin:0">${esc(S.authMsg||"")}</p><button class="btn primary" id="closeSheet">Listo</button>`;
  if(m==="cuenta")body=`<div class="small muted">${esc(S.me&&S.me.email||"")}</div><label class="f">Tu nombre (así aparecés en las tablas)<input type="text" id="auNombre" maxlength="40" value="${esc(S.me&&S.me.nombre||"")}"></label><button class="btn primary" id="auSaveName">Guardar nombre</button><button class="btn" data-amode="nueva">Cambiar contraseña</button><button class="btn" id="auOut">Cerrar sesión</button>`;
  el.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${tit}"><div class="hd"><div class="row" style="justify-content:space-between"><h2>${tit}</h2><button class="btn sm" id="closeSheet">Cerrar</button></div>${m==="in"||m==="up"?`<div class="small muted">Con tu cuenta jugás el Fantasy y el Prode de Line &amp; Maul.</div>`:""}</div><div class="list" style="padding:16px;display:flex;flex-direction:column;gap:12px">${body}</div></div></div>`;
  const f=el.querySelector("input");if(f)setTimeout(()=>f.focus(),50)}
const authErr=e=>{const s=String(e&&e.message||"");if(/invalid login/i.test(s))return "Mail o contraseña incorrectos.";if(/already registered|already exists/i.test(s))return "Ese mail ya tiene cuenta. Ingresá o recuperá la contraseña.";if(/password/i.test(s)&&/6/.test(s))return "La contraseña tiene que tener al menos 6 caracteres.";if(/email/i.test(s)&&/invalid/i.test(s))return "Revisá el mail.";if(/rate|too many/i.test(s))return "Demasiados intentos. Esperá unos minutos.";if(/not confirmed/i.test(s))return "Todavía no confirmaste tu mail. Revisá tu casilla.";return "No se pudo. Probá de nuevo."};
$("#sheet").addEventListener("click",async e=>{if(sheetRole!=="auth")return;
  const md=e.target.closest("[data-amode]");if(md){S.authMode=md.dataset.amode;drawAuth();return}
  const back=location.origin+location.pathname;
  if(e.target.id==="auGo"){const b=e.target;const em=(($("#auEmail")||{}).value||"").trim();const pw=($("#auPass")||{}).value||"";b.disabled=true;
    try{
      if(S.authMode==="in"){const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;closeSheet();toast("¡Hola!")}
      else if(S.authMode==="up"){const nombre=(($("#auNombre")||{}).value||"").trim().slice(0,40);if(!nombre){toast("Poné tu nombre");b.disabled=false;return}if(pw.length<6){toast("La contraseña tiene que tener al menos 6 caracteres");b.disabled=false;return}
        const r=await sb.auth.signUp({email:em,password:pw,options:{data:{nombre},emailRedirectTo:back}});if(r.error)throw r.error;
        if(r.data&&r.data.session){closeSheet();toast("¡Cuenta creada! Ya podés jugar")}else{S.authMsg=`Te mandamos un mail a ${em}. Tocá el link para confirmar tu cuenta y listo.`;S.authMode="mail";drawAuth()}}
      else if(S.authMode==="olvide"){const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:back});if(r.error)throw r.error;S.authMsg=`Si ${em} tiene cuenta, te llegó un mail para elegir una contraseña nueva.`;S.authMode="mail";drawAuth()}
      else if(S.authMode==="nueva"){if(pw.length<6){toast("Mínimo 6 caracteres");b.disabled=false;return}const r=await sb.auth.updateUser({password:pw});if(r.error)throw r.error;closeSheet();toast("Contraseña cambiada")}
    }catch(err){toast(authErr(err));b.disabled=false}return}
  if(e.target.id==="auSaveName"){const n=(($("#auNombre")||{}).value||"").trim().slice(0,40);if(!n){toast("Poné tu nombre");return}const r=await sb.from("profiles").update({nombre:n}).eq("id",S.uid);if(r.error){toast("No se pudo guardar");return}S.me.nombre=n;renderAuthBtn();closeSheet();toast("Nombre guardado");render();return}
  if(e.target.id==="auOut"){await sb.auth.signOut();closeSheet();toast("Sesión cerrada");return}
});
$("#sheet").addEventListener("keydown",e=>{if(sheetRole==="auth"&&e.key==="Enter"&&e.target.tagName==="INPUT"){const g=$("#auGo")||$("#auSaveName");if(g)g.click()}});
document.addEventListener("click",e=>{const a=e.target.closest("[data-auth]");if(a){e.preventDefault();openAuth(a.dataset.auth)}});
$("#authBtn").addEventListener("click",()=>openAuth());
const loginBanner=txt=>`<div class="banner" style="align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${txt}</span><button class="btn primary sm" data-auth="up">Crear cuenta</button><button class="btn sm" data-auth="in">Ingresar</button></div>`;

/* ---------- Admin → Importar (lo que te paso por el chat) ---------- */
function adminImport(){return `<div class="card"><h3>Importar</h3><p class="small muted" style="margin:0">Pegá acá el texto que te paso por el chat (fixture, resultados, formaciones, puntos, camisetas…) y tocá Importar.</p>
  <textarea id="impTxt" rows="8" spellcheck="false" style="width:100%;font:13px/1.4 ui-monospace,monospace;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px" placeholder='{"fechas": {...}}'></textarea>
  <div class="row"><button class="btn primary" id="impGo">Importar</button><span class="small muted" id="impMsg"></span></div></div>
  <div class="card"><h3>Datos iniciales</h3><p class="small muted" style="margin:0">Carga los planteles, camisetas y entrenadores que armamos en 2026. Usalo una sola vez al arrancar (pisa lo que haya).</p><div class="row"><button class="btn" id="impSeed">Cargar datos iniciales</button></div></div>`}
async function runImport(txt){let d;try{d=JSON.parse(txt)}catch(e){throw new Error("El texto no es válido. Copialo completo, desde la primera { hasta la última }.")}
  const res=[];
  if(d.config)for(const [k,v] of Object.entries(d.config)){if(d.reemplazar_config){await S.db.doc("config/"+k).set(v)}else{const cur=(S.db.cache.config||{})[k]||{};const nv=Object.assign({},cur);for(const [kk,vv] of Object.entries(v))nv[kk]=(vv&&typeof vv==="object"&&!Array.isArray(vv)&&cur[kk]&&typeof cur[kk]==="object"&&!Array.isArray(cur[kk]))?Object.assign({},cur[kk],vv):vv;await S.db.doc("config/"+k).set(nv)}res.push(k)}
  if(d.fechas)for(const [id,v] of Object.entries(d.fechas)){await S.db.doc("fechas/"+id).update(v);res.push(v.nombre||id)}
  if(Array.isArray(d.borrar_fechas))for(const id of d.borrar_fechas){await S.db.doc("fechas/"+id).delete();res.push("borrada "+id)}
  return res}
$("#view").addEventListener("click",async e=>{if(e.target.id!=="impSeed"||!S.isOwner)return;const b=e.target;if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="¿Seguro? Tocá de nuevo";setTimeout(()=>{if(b.isConnected){b.dataset.arm="";b.textContent="Cargar datos iniciales"}},4000);return}
  b.disabled=true;try{const r=await fetch("datos/inicial.json",{cache:"no-store"});if(!r.ok)throw new Error();const out=await runImport(await r.text());toast("Cargado: "+out.join(", "))}catch(err){toast("No se pudieron cargar los datos iniciales")}b.disabled=false;b.dataset.arm="";b.textContent="Cargar datos iniciales"});
$("#view").addEventListener("click",async e=>{if(e.target.id!=="impGo"||!S.isOwner)return;const b=e.target;const msg=$("#impMsg");b.disabled=true;msg.textContent="Importando…";
  try{const r=await runImport($("#impTxt").value||"");msg.textContent="";$("#impTxt").value="";toast(r.length?"Importado: "+r.join(", "):"No había nada para importar")}catch(err){msg.textContent=err.message||"No se pudo importar";toast("No se pudo importar")}b.disabled=false});

/* ---------- arranque ---------- */
async function start(){
  render();
  if(!sb){S.db=null;render();return}
  const db=makeDb();S.db=db;S.user=lmUser;
  try{const {data}=await sb.auth.getSession();await applySession(data&&data.session)}catch(e){renderAuthBtn()}
  if(LM_RECOVERY){try{history.replaceState(null,"",location.pathname)}catch(e){}setTimeout(()=>{if(S.uid)openAuth("nueva");else toast("El link para cambiar la contraseña venció. Pedí uno nuevo.")},400)}
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"&&S.authMode!=="nueva"){setTimeout(()=>openAuth("nueva"),300)}setTimeout(()=>applySession(session),0)});
  let got=0;const done=()=>{got++;if(got>=4){S.ready=true;render()}else if(S.ready)scheduleRender()};
  const once=fn=>{let first=true;return snap=>{fn(snap);if(first){first=false;done()}else scheduleRender()}};
  const err=()=>{};
  db.doc("config/plantel").onSnapshot(once(s=>{const d=s.exists?s.data():null;S.plantel=normPlantel(Object.fromEntries(Object.entries(d&&d.players||{}).filter(([,p])=>p&&DIVS.includes(p.d))))}),err);
  db.doc("config/reglas").onSnapshot(once(s=>{const d=s.exists?s.data():null;S.pts=Object.assign({},DEF_PTS,d&&d.pts||{})}),err);
  db.collection("fechas").onSnapshot(once(q=>{S.fechas=q.docs.map(d=>{const o=Object.assign({},d.data(),{id:d.id});o._estado=o.estado;delete o.estado;Object.defineProperty(o,"estado",{get(){return estDe(this)},enumerable:true});return o})}),err);
  S.ligas={};S.cierres={};
  db.collection("prode").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.prode=m;if(S.ready)scheduleRender()},err);
  db.doc("config/entrenadores").onSnapshot(s=>{const d=s.exists?s.data():null;S.coaches=Object.assign({},d&&d.hc||{});if(S.ready)scheduleRender()},err);
  db.doc("config/camisetas").onSnapshot(s=>{const d=s.exists?s.data():null;S.kits=Object.assign({},d&&d.kits||{});if(S.ready)scheduleRender()},err);
  db.collection("cierres").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.cierres=m;S.cierresOk=true;autoCierre();if(S.ready)scheduleRender()},err);
  db.collection("ligas").onSnapshot(q=>{const m={};q.docs.forEach(d=>{const tor=(d.data()||{}).torneos||{};for(const c in tor)m[c]={nombre:String(tor[c].nombre||"Torneo"),owner:d.id,juego:tor[c].juego||null,comps:Array.isArray(tor[c].comps)?tor[c].comps:null};if(d.id===S.uid)S.ligasOwn=tor});S.ligas=m;if(S.ready)scheduleRender()},err);
  db.collection("equipos").onSnapshot(once(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.equipos=m}),err);
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},8000);
  setInterval(()=>{if(S.ready&&!document.hidden&&sheetSlot==null&&sheetRole==null&&(S.tab==="xv"||S.tab==="pxv"))scheduleRender()},30000);
  /* trae lo nuevo (resultados, tablas) cada minuto, sin pisar lo que estás editando */
  setInterval(()=>{if(!document.hidden&&!S.dirty&&!S.prDirty&&sheetSlot==null&&sheetRole==null)db.refreshAll()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!S.dirty&&!S.prDirty)db.refreshAll()});
  setTimeout(autoCierre,1500);
}
start();
})();
